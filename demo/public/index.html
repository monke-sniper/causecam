<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Account settings — CAUSECAM demo</title>
    <style>
      body { font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 3rem auto; padding: 0 1rem; color: #1d1d1f; }
      h1 { font-size: 1.4rem; }
      form { display: grid; gap: 1rem; }
      label { display: grid; gap: .25rem; font-weight: 600; }
      label.inline { display: flex; gap: .5rem; align-items: center; font-weight: 400; }
      input, select, button { font: inherit; padding: .45rem .6rem; }
      button { justify-self: start; background: #1d4ed8; color: white; border: 0; border-radius: 6px; padding: .5rem 1rem; cursor: pointer; }
      #status { min-height: 1.5rem; }
      #status.error { color: #b91c1c; }
      #status.ok { color: #15803d; }
    </style>
  </head>
  <body>
    <h1>Account settings</h1>
    <form id="settings-form">
      <label>Display name
        <input id="displayName" name="displayName" data-testid="display-name" required maxlength="80" />
      </label>
      <label>Time zone
        <select id="timezone" name="timezone" data-testid="timezone">
          <option value="UTC">UTC</option>
          <option value="Europe/London">Europe/London</option>
          <option value="Europe/Berlin">Europe/Berlin</option>
          <option value="America/New_York">America/New_York</option>
          <option value="Asia/Tokyo">Asia/Tokyo</option>
        </select>
      </label>
      <label>Email digest
        <select id="digestFrequency" name="digestFrequency" data-testid="digest-frequency">
          <option value="daily">Daily</option>
          <option value="weekly">Weekly</option>
          <option value="never">Never</option>
        </select>
      </label>
      <label class="inline">
        <input type="checkbox" id="marketingEmails" name="marketingEmails" data-testid="marketing-emails" /> Product news emails
      </label>
      <button type="submit" data-testid="save-settings">Save settings</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
    <script src="/app.js"></script>
  </body>
</html>
